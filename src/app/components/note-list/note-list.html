@let notes = noteService.getAll();
@if (notes.length === 0) {
  <p class="text-muted">Užrašų dar nėra.</p>
} @else {
  <div class="row g-3">
    @for (note of notes; track note.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">{{ note.title }}</h5>
            <p class="card-text" style="white-space: pre-wrap">{{ note.text }}</p>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted">{{ note.createdAt | date: 'yyyy-MM-dd HH:mm' }}</small>
            <button class="btn btn-outline-danger btn-sm" type="button" (click)="noteService.delete(note.id)">
              Ištrinti
            </button>
          </div>
        </div>
      </div>
    }
  </div>
}
